name: Build and publish application binaries

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'desktop/**'
      - 'mobile/**'
      - 'scripts/**'
      - 'package.json'
      - 'capacitor.config.json'
      - 'docs/release/**'
      - '.github/workflows/release-binaries.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-release-v0.1.0
  cancel-in-progress: true

env:
  RELEASE_TAG: v0.1.0

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm run prepare:web
      - run: npm run check

  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run prepare:web
      - name: Build one-click Windows installer
        shell: pwsh
        run: |
          $env:CSC_IDENTITY_AUTO_DISCOVERY='false'
          npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
          if-no-files-found: error

  macos:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run prepare:web
      - name: Build universal macOS DMG and app ZIP
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  android:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm install
      - run: npm run prepare:web
      - run: npx cap add android
      - run: node scripts/prepare-native.mjs android
      - run: npx cap sync android
      - name: Build installable Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Stage Android binary
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Reality-Bridge-Alien-Conductor-Android-v0.1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error

  ios:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run prepare:web
      - run: npx cap add ios
      - run: node scripts/prepare-native.mjs ios
      - run: npx cap sync ios
      - name: Build iPhone Simulator app
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App -configuration Release -sdk iphonesimulator \
            -derivedDataPath build-simulator CODE_SIGNING_ALLOWED=NO
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            build-simulator/Build/Products/Release-iphonesimulator/App.app \
            dist/Reality-Bridge-Alien-Conductor-iOS-Simulator-v0.1.0.zip
      - name: Build unsigned iPhone device IPA payload
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          rm -rf Payload
          mkdir Payload
          cp -R build-device/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry dist/Reality-Bridge-Alien-Conductor-iOS-Unsigned-v0.1.0.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: |
            dist/*iOS*.zip
            dist/*iOS*.ipa
          if-no-files-found: error

  release:
    needs: [windows, macos, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "Reality Bridge Alien Conductor v0.1.0" --notes-file docs/release/RELEASE_NOTES.md
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Reality Bridge Alien Conductor v0.1.0" --notes-file docs/release/RELEASE_NOTES.md
          fi
          find release-assets -type f -print0 | xargs -0 -n1 gh release upload "$RELEASE_TAG" --clobber
          gh release view "$RELEASE_TAG" --json url,tagName,name,assets
